    <!-- Adicionar formulário -->
 <div id="form-container">
  <form id="custom-form">

    <div class="form-group">
      <label for="option1">Escolha o país</label>
      <select id="option1" class="form-control">
        <option value="">País</option>
        <option value="A">Portugal</option>
        <option value="B">Opção B</option>
        <option value="C">Opção C</option>
      </select>
    </div>

    <div class="form-group">
      <label for="option2">Escolha a cidade</label>
      <select id="option2" class="form-control">
        <option value="">Cidade</option>
        <option value="1">Porto</option>
        <option value="2">Opção 2</option>
        <option value="3">Opção 3</option>
      </select>
    </div>

    <button type="submit" id="form-button">Ver</button>
  </form>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Java Script -->
     <script>
  // Get both select elements
  const countrySelect = document.getElementById('option1');
  const citySelect = document.getElementById('option2');

  // Function to check selections and redirect
  function checkSelections() {
    const country = countrySelect.value;
    const city = citySelect.value;

    // When both match the desired combination
    if (country === 'A' && city === '1') {
      window.location.href = 'Page_Locais_Porto.html';  // redirect
    }
  }

  // Listen for changes on both dropdowns
  countrySelect.addEventListener('change', checkSelections);
  citySelect.addEventListener('change', checkSelections);
</script>
