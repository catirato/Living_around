    <!-- Adicionar Formulário -->
<div id="contact-form-container" class="d-flex justify-content-center align-items-center">
  <form id="contact-form">
    
    <div class="mb-3">
      <label for="name" class="form-label text-white">Nome</label>
      <input type="text" class="form-control form-input" id="name" placeholder="O seu nome">
    </div>

    <div class="mb-3">
      <label for="email" class="form-label text-white">Email</label>
      <input type="email" class="form-control form-input" id="email" placeholder="O seu email">
    </div>

    <div class="mb-3">
      <label for="message" class="form-label text-white">Mensagem</label>
      <textarea class="form-control form-input" id="message" rows="5" placeholder="A sua Mensagem"></textarea>
    </div>

    <button id="botaoform" type="submit" class="btn btn-outline-light w-100">Enviar</button>
  </form>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<!-- Alerta quando formulário é enviado -->
<div id="custom-alert" class="alert-box">
  <p id="alert-message">Seu formulário foi enviado com sucesso!</p>
  <button id="alert-ok">OK</button>
</div>

<script>
  const form = document.getElementById('contact-form'); // your form ID
  const alertBox = document.getElementById('custom-alert');
  const alertOk = document.getElementById('alert-ok');

  form.addEventListener('submit', function(event) {
    event.preventDefault(); // prevent page reload

    // Show alert
    alertBox.style.display = 'block';

    // Optional: reset the form
    form.reset();
  });

  // Close the alert when clicking OK
  alertOk.addEventListener('click', function() {
    alertBox.style.display = 'none';
  });
</script>


</body>
